<!DOCTYPE html>
<html>
<head>
   <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title></head>
<body>
  <h2>Faculty Availability</h2>
  <div id="status-list"></div>
  <button onclick="loadStatus()" id="reload">Reload</button>

  <script>
   async function loadStatus() {
  const urlParams = new URLSearchParams(window.location.search);
  const section = urlParams.get("section");

  const response = await fetch(`/.netlify/functions/getStatus?section=${section}`);
  const data = await response.json();

  const container = document.getElementById("status-list");
  container.innerHTML = "";

  data.forEach(f => {
    const div = document.createElement("div");
    div.className = "status-card";

    const name = document.createElement("span");
    name.textContent = `${f.name}`;

    const icon = document.createElement("span");
    icon.innerHTML = f.status === "Available"
      ? `<svg class="status-icon" fill="#4CAF50" viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`
      : `<svg class="status-icon" fill="#F44336" viewBox="0 0 24 24"><path d="M18.3 5.71L12 12l6.3 6.29-1.41 1.42L10.59 13.4 4.29 19.71 2.88 18.3 9.17 12 2.88 5.71 4.29 4.29 10.59 10.6l6.3-6.31z"/></svg>`;

    div.appendChild(name);
    div.appendChild(icon);
    container.appendChild(div);
  });
}


    loadStatus();
  </script>
</body>
</html>
