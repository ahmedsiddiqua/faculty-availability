<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="Icon.png">
  <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body>
  <br><br>
  <h2>Login</h2> 
  <div id="container" class="container">
  <b><u>USN:</u></b> <br>
  <input type="text" id="usn" placeholder="USN" maxlength="10"> <br> <br>
  <div class="btn" id="btn">
  <button onclick="login()" id="login" class="login">Login</button>
  </div>
</div>
  <script>
  async function login() {
    const usn = document.getElementById("usn").value.trim().toUpperCase();

    const response = await fetch("/.netlify/functions/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ usn })
    });

    const data = await response.json();
    if (data.section) {
      window.location.href = `/dashboard.html?section=${data.section}`;
    } else {
      alert("Invalid details");
    }
  }
</script>


</body>
</html>
