<!DOCTYPE html>
<html>
<head>
  <title>Toggle Availability</title>
     <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
<body>
  <h2>Teacher_Name_Goes_Here</h2>
  <p>Current Status: <span id="status">Unknown</span></p>
  <button onclick="toggle()">Toggle Status</button>

  <script>
    const teacherName = "Teacher_Name_Goes_Here";

    async function toggle() {
      const response = await fetch("/.netlify/functions/toggleStatus", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: teacherName })
      });
      const data = await response.json();
      document.getElementById("status").innerText = data.newStatus || "Unknown";
    }
  </script>
</body>
</html>
